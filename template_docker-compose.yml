services:
  jupyter-quant:
    build:
      context: .
      # platforms:
      #   - "linux/amd64"
      #   - "linux/arm64"
      args:
        USER: ${USER}
        USER_ID: ${USER_ID}
        USER_GID: ${USER_GID}
        APT_PROXY: ${APT_PROXY}
    # not upstream's gnzsnz/jupyter-quant (different uid, different base): set the full
    # published reference, e.g. ghcr.io/signalsenseuk/jupyterquant:2606.1-ss.1
    image: ${IMAGE_REF:?set IMAGE_REF to the published ghcr reference}
    environment:
      APT_PROXY: ${APT_PROXY}
      BYODF: ${BYODF:-}
      SSH_KEYDIR: ${SSH_KEYDIR:-}
      # START_SCRIPTS: ${START_SCRIPTS:-}
      # SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      # SSH_PASSPHRASE_FILE: ${SSH_PASSPHRASE_FILE:-}
      TZ: ${QUANT_TZ:-}
    restart: unless-stopped
    ports:
      - ${LISTEN_PORT}:8888
    volumes:
      - quant_conf:/home/${USER}/.config
      - quant_data:/home/${USER}/.local
      - ${PWD}/Notebooks:/home/${USER}/Notebooks
    # secrets:
    #   - ssh_passphrase

volumes:
  quant_conf:
  quant_data:

